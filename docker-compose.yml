# Local development stack — all services
# Compatible with Docker and Podman (rootless).
# Podman users: install podman-compose and use `podman-compose up -d`
#   userns_mode: keep-id maps your host UID into the container so bind-mount
#   volume permissions work correctly without chown workarounds.
name: facebook-clone

services:
  # ── Application ─────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src:ro          # hot-reload source
      - ./migrations:/app/migrations:ro
      - ./uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql+asyncpg://fb:fb_password@postgres:5432/facebook_clone
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: dev-secret-change-in-prod
      STORAGE_BACKEND: local
      DEBUG: "true"
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    userns_mode: keep-id      # Podman rootless: map host UID into container
    restart: unless-stopped

  # ── PostgreSQL ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fb
      POSTGRES_PASSWORD: fb_password
      POSTGRES_DB: facebook_clone
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fb -d facebook_clone"]
      interval: 5s
      timeout: 5s
      retries: 10
    userns_mode: keep-id      # Podman rootless: map host UID into container
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    userns_mode: keep-id      # Podman rootless: map host UID into container
    restart: unless-stopped

  # ── MinIO (S3-compatible local storage) ──────────────────────────────
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    userns_mode: keep-id      # Podman rootless: map host UID into container
    restart: unless-stopped

  # ── Migration runner (one-shot) ──────────────────────────────────────
  # Uses the development target (has bash + alembic CLI) so that `sh -c` works.
  # The production/Distroless stage has no shell; migrations run here instead.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: ["sh", "-c", "alembic upgrade head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://fb:fb_password@postgres:5432/facebook_clone
    depends_on:
      postgres:
        condition: service_healthy
    userns_mode: keep-id      # Podman rootless: map host UID into container
    restart: "no"

volumes:
  pgdata:
  redisdata:
  miniodata:
