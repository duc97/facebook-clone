# Staging overlay — use with: docker compose -f docker-compose.yml -f docker-compose.staging.yml up
name: facebook-clone-staging

services:
  app:
    build:
      target: production
    image: ghcr.io/your-org/facebook-clone:staging
    replicas: 2
    environment:
      DEBUG: "false"
      STORAGE_BACKEND: s3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: always

  postgres:
    # Staging uses external managed DB (AWS RDS etc.)
    # Override DATABASE_URL in app env instead
    profiles:
      - local-only

  redis:
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 512M
