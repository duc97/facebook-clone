apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: facebook-clone-pdb
  namespace: facebook-clone
  labels:
    app: facebook-clone
    component: api
    version: "1.0"
    app.kubernetes.io/name: facebook-clone
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "1.0"
spec:
  # Ensures at least 2 pods remain available during voluntary disruptions
  # (node maintenance, cluster upgrades, etc.), preserving HA with 3 replicas.
  minAvailable: 2
  selector:
    matchLabels:
      app: facebook-clone
      component: api
