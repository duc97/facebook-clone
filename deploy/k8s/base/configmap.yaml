apiVersion: v1
kind: ConfigMap
metadata:
  name: facebook-clone-config
  namespace: production
data:
  DATABASE_ECHO: "false"
  DEBUG: "false"
  STORAGE_BACKEND: "s3"
  S3_REGION: "us-east-1"
  CORS_ORIGINS: '["https://facebook-clone.example.com"]'
  DB_POOL_SIZE: "20"
  DB_POOL_MAX_OVERFLOW: "40"
  DB_POOL_RECYCLE: "3600"
  CACHE_ENABLED: "true"
  FEED_FAN_OUT_MAX_FRIENDS: "500"
  LOG_LEVEL: "info"
