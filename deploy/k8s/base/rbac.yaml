---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: facebook-clone
  namespace: production
  labels:
    app.kubernetes.io/name: facebook-clone
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: facebook-clone-role
  namespace: production
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: facebook-clone-rolebinding
  namespace: production
subjects:
  - kind: ServiceAccount
    name: facebook-clone
    namespace: production
roleRef:
  kind: Role
  name: facebook-clone-role
  apiGroup: rbac.authorization.k8s.io
