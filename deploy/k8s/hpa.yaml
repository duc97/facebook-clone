apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: facebook-clone-hpa
  namespace: facebook-clone
  labels:
    app: facebook-clone
    component: api
    version: "1.0"
    app.kubernetes.io/name: facebook-clone
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "1.0"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: facebook-clone
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Custom metric: active WebSocket connections per pod.
    # Requires a custom metrics adapter (e.g. prometheus-adapter) exposing
    # the 'websocket_connections' metric. Uncomment when the adapter is installed.
    # - type: Pods
    #   pods:
    #     metric:
    #       name: websocket_connections
    #     target:
    #       type: AverageValue
    #       averageValue: "100"
  behavior:
    scaleDown:
      # Wait 5 minutes before scaling down to avoid flapping
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max
