apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base
  - ../../app/deployment-blue.yaml
  - ../../app/deployment-green.yaml
  - ../../app/service.yaml
  - ../../app/hpa.yaml
  - ../../app/pdb.yaml
  - ../../app/ingress.yaml
  - ../../app/cert-issuer.yaml
  - ../../app/network-policy.yaml

images:
  - name: ghcr.io/your-org/facebook-clone
    newTag: latest   # Replaced by CI/CD

patches:
  - target:
      kind: Deployment
      name: facebook-clone-blue
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
