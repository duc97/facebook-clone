# TEMPLATE ONLY — DO NOT COMMIT REAL VALUES
# Replace placeholders before applying, or use sealed-secrets / external-secrets-operator.
# Example (sealed-secrets): kubeseal --fetch-cert | kubeseal --format=yaml > sealed-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: facebook-clone-secrets
  namespace: facebook-clone
  labels:
    app: facebook-clone
    component: api
    version: "1.0"
    app.kubernetes.io/name: facebook-clone
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "1.0"
  annotations:
    note: "Template only — use sealed-secrets or external-secrets-operator in production"
type: Opaque
stringData:
  # Database connection string — asyncpg driver required
  DATABASE_URL: "postgresql+asyncpg://fb:CHANGE_ME@postgres-service:5432/facebook_clone"

  # Redis connection string
  REDIS_URL: "redis://redis-service:6379/0"

  # JWT signing secret — use a long random string (e.g. openssl rand -hex 64)
  JWT_SECRET_KEY: "CHANGE_ME_USE_LONG_RANDOM_STRING"

  # S3 / object storage
  S3_BUCKET_NAME: "facebook-clone-media"
  S3_ENDPOINT_URL: ""
