apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: facebook-clone-ingress
  namespace: facebook-clone
  labels:
    app: facebook-clone
    component: api
    version: "1.0"
    app.kubernetes.io/name: facebook-clone
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "1.0"
  annotations:
    kubernetes.io/ingress.class: nginx
    # TLS — replace with your cert-manager ClusterIssuer name
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Body size limit: 50 MB (matches MAX_MEDIA_UPLOAD_SIZE)
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    # CORS — update origin to match your frontend domain
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://facebook-clone.example.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type"
    # Ingress-level rate limiting (coarse guard; app enforces per-role limits)
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    # WebSocket upgrade support
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  tls:
    - hosts:
        # Replace with your actual hostname
        - api.facebook-clone.example.com
      # Secret created by cert-manager; placeholder until TLS is provisioned
      secretName: facebook-clone-tls
  rules:
    - host: api.facebook-clone.example.com
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: facebook-clone
                port:
                  number: 80
          - path: /graphql/
            pathType: Prefix
            backend:
              service:
                name: facebook-clone
                port:
                  number: 80
